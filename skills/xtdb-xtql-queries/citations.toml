# The spans of xtdb/xtdb this skill cites, one [[cite]] per footnote id.
# `scripts/skill_citations.py lock` resolves each anchor at `tag`, records
# its lines and hash in citations.lock.json, and regenerates the footnote
# definitions in SKILL.md; `drift` resolves them again at a newer tag.
#
# An anchor is either `heading` (a Markdown heading's text; the span runs to
# the next heading at the same or a higher level, or with `intro = true` to
# the next heading of any level) or `form` (the start of a top-level form in
# column 0; the span runs to the next one).

[source]
repo = "xtdb/xtdb"
tag = "v2.1.0"

# Changes under these paths that no citation covers are reported as gaps.
watch = [
  "docs/src/content/docs/reference/main/xtql/",
