name: Citation drift
# Each skill pins its citations to an XTDB tag. Weekly, compare every
# cited span with the newest upstream tag, pre-releases included, and
# keep one open issue holding the latest report while any span differs.
# `drift` covers cited source and docs only: the observed footnotes are
# re-checked by the evals, which need an XTDB node and run by hand.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "Upstream XTDB changed spans the skills cite"
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Report drift per skill
        id: drift
        run: |
          drifted=false
          : > report.md
          for cfg in skills/*/citations.edn; do
            skill=$(dirname "$cfg")
            status=0
            out=$(nix run .#skill-citations -- drift "$skill" --to latest 2>&1) || status=$?
            printf '%s\n' "$out"
            case $status in
              0) ;;
              1)
                drifted=true
                # The diffs stay in the run log: a large one pushes the
                # issue body past GitHub's 65,536-character limit.
                summary=$(printf '%s\n' "$out" | grep -vE '^ {12}[-+]')
                printf '## %s\n\n```\n%s\n```\n\n' "$skill" "$summary" >> report.md
                ;;
              *) exit "$status" ;;
            esac
          done
          echo "drifted=$drifted" >> "$GITHUB_OUTPUT"
      - name: Open or update the drift issue
        if: steps.drift.outputs.drifted == 'true'
        run: |
          {
            echo "A newer XTDB tag changes spans the skills cite. For each skill:"
            echo
            echo '1. Fix the claims whose spans changed, then `skill-citations bump <skill> --to <tag>`.'
            echo '2. Move the eval to the same version: the `ghcr.io/xtdb/xtdb` image and the client in `evals/deps.edn`.'
            echo '3. Re-run `examples` and `storage` from `evals/`, which re-check the observed footnotes.'
            echo
            echo "The diffs of each changed span are in [the run's log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), or from \`skill-citations drift <skill> --to latest\`."
            echo
            cat report.md
          } > full.md
          # GitHub caps an issue body at 65,536 characters by its own count,
          # which rejects a 65,000-byte report, so cut well short of it, at a
          # line boundary, and close the code block the cut leaves open.
          if [ "$(wc -c < full.md)" -gt 50000 ]; then
            {
              head -c 50000 full.md | sed '$d'
              echo '```'
              echo
              echo "Cut at 50,000 characters; the whole report is in the run's log."
            } > body.md
          else
            cp full.md body.md
          fi
          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi
