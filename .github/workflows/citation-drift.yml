name: Citation drift
# Each skill pins its citations to an XTDB tag. Weekly, compare every
# cited span with the newest upstream tag, pre-releases included, and
# keep one open issue holding the latest report while any span differs.
# `drift` covers cited source and docs only: the observed footnotes are
# re-checked by the evals, which need an XTDB node and run by hand.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_TITLE: "Upstream XTDB changed spans the skills cite"
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      # Exit 0: no span differs; 1: some do, and body.md holds the issue
      # body; anything else fails the job.
      - name: Report drift per skill
        id: drift
        run: |
          status=0
          nix run .#xtdb-skills -- drift --to latest --report body.md \
            --log-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || status=$?
          case $status in
            0) echo "drifted=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drifted=true" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Open or update the drift issue
        if: steps.drift.outputs.drifted == 'true'
        run: |
          existing=$(gh issue list --state open --search "$ISSUE_TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi
